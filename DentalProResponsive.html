<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DentalPro - Book Appointment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: #fff;
      color: #222;
    }

    .container {
      display: flex;
      min-height: 100vh;
    }

    .form-section {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-section h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .form-section p {
      font-size: 14px;
      color: #555;
      margin-bottom: 25px;
    }

    form label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    form input,
    form select,
    form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 18px;
      font-size: 14px;
      background: #f4f7fb;
    }

    .row {
      display: flex;
      gap: 15px;
    }
    .row > div {
      flex: 1;
    }

    form button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    form button:hover {
      background: #2563eb;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }


    .image-section {
      flex: 1;
      background: url("https://images.unsplash.com/photo-1494253109108-2e30c049369b?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=crop&w=1950&q=100") no-repeat center center/cover;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }
      .image-section {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="form-section">
      <h2>DentalPro</h2>
      <h1>Book your appointment with DentalPro in 2 minutes</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed molestie metus turpis. Vivamus mollis diam quis erat tincidunt.</p>

      <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>

        <div class="row">
          <div>
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter Phone Number" required>
          </div>
          <div>
            <label for="treatment">Treatment</label>
            <select id="treatment" required>
              <option value="">Select Treatment</option>
              <option value="general">General Dentistry</option>
              <option value="cosmetic">Cosmetic Dentistry</option>
              <option value="surgery">Oral Surgery</option>
            </select>
          </div>
        </div>

        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write message"></textarea>

        <button type="submit">Book Appointment</button>
      </form>

      <div class="footer">© 2019 DentalPro - All Rights Reserved.</div>
    </div>

    <div class="image-section"></div>
  </div>
</body>
</html>
